<svg width="600" height="450" viewBox="0 0 600 450" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background Elements -->
    <rect x="50" y="50" width="500" height="350" rx="20" fill="#F9FAFB"/>
    <rect x="70" y="70" width="460" height="310" rx="15" fill="white" stroke="#E5E7EB" stroke-width="2"/>
    
    <!-- Header Bar -->
    <rect x="70" y="70" width="460" height="50" rx="15" fill="#F3F4F6"/>
    <circle cx="100" cy="95" r="8" fill="#04BA07"/>
    <rect x="120" y="90" width="100" height="10" rx="5" fill="#D1D5DB"/>
    
    <!-- Chart Area -->
    <g transform="translate(100, 180)">
        <!-- Grid Lines -->
        <line x1="0" y1="0" x2="400" y2="0" stroke="#F3F4F6" stroke-width="2"/>
        <line x1="0" y1="50" x2="400" y2="50" stroke="#F3F4F6" stroke-width="2"/>
        <line x1="0" y1="100" x2="400" y2="100" stroke="#F3F4F6" stroke-width="2"/>
        
        <!-- Bars -->
        <rect x="20" y="60" width="40" height="40" rx="4" fill="#9CA3AF" opacity="0.5"/>
        <rect x="80" y="40" width="40" height="60" rx="4" fill="#9CA3AF" opacity="0.7"/>
        <rect x="140" y="20" width="40" height="80" rx="4" fill="#04BA07" opacity="0.8"/>
        <rect x="200" y="0" width="40" height="100" rx="4" fill="#04BA07"/> <!-- Highest Bar -->
        <rect x="260" y="30" width="40" height="70" rx="4" fill="#04BA07" opacity="0.9"/>
        <rect x="320" y="50" width="40" height="50" rx="4" fill="#404040" opacity="0.3"/>
    </g>

    <!-- Floating Cards (Glassmorphism Style) -->
    <g transform="translate(420, 120)">
        <rect width="120" height="80" rx="10" fill="white" stroke="#E5E7EB" filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.1))"/>
        <circle cx="30" cy="30" r="15" fill="#ECFDF5"/>
        <path d="M25 30 L30 35 L35 25" stroke="#04BA07" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="55" y="35" font-family="Vazirmatn, sans-serif" font-size="12" fill="#404040">لیدهای جدید</text>
        <text x="55" y="55" font-family="Vazirmatn, sans-serif" font-size="16" font-weight="bold" fill="#04BA07">+۲۴٪</text>
    </g>

    <g transform="translate(60, 280)">
        <rect width="100" height="60" rx="10" fill="white" stroke="#E5E7EB" filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.1))"/>
        <circle cx="30" cy="30" r="15" fill="#EFF6FF"/>
        <path d="M22 30 H38 M30 22 V38" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
        <text x="55" y="35" font-family="Vazirmatn, sans-serif" font-size="12" fill="#404040">پروژه‌ها</text>
    </g>

    <!-- Decorative Dots -->
    <circle cx="550" cy="380" r="4" fill="#04BA07"/>
    <circle cx="530" cy="390" r="4" fill="#04BA07" opacity="0.6"/>
    <circle cx="540" cy="370" r="4" fill="#04BA07" opacity="0.3"/>
</svg>